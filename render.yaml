services:
  - type: web
    name: figma-review-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: FIGMA_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DESIGN_SYSTEM_FILE_KEY
        sync: false
      - key: DESIGN_SYSTEM_PAGES
        sync: false
      - key: GUIDELINES_DOC_ID
        sync: false
      - key: TEAM_ACCESS_CODE
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
