<style>
  :root {
    --bg: #f3f4f7;
    --card-bg: #ffffff;
    --text: #262b33;
    --text-muted: #767c88;
    --border: rgba(20, 24, 32, 0.08);
    --primary: #5b7a99;
    --primary-hover: #4c6883;
    --primary-soft: #e7edf2;
    --danger: #c0392b;
    --radius-lg: 16px;
    --radius-full: 999px;
  }
  html,
  body {
    height: 100%;
  }
  body {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    margin: 0;
    padding: 0;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  #main-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px;
  }
  #app-footer {
    flex: none;
    padding: 8px 14px 12px;
    border-top: 1px solid var(--border);
  }
  #app-header {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 12px;
    padding: 0 2px;
  }
  #app-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  #build-version {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    box-shadow: 0 1px 2px rgba(20, 24, 32, 0.04), 0 1px 10px rgba(20, 24, 32, 0.04);
    padding: 4px 14px;
    margin-bottom: 10px;
  }
  .card-row {
    padding: 10px 0;
  }
  .card-row + .card-row {
    border-top: 1px solid var(--border);
  }
  .row-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .row-label svg {
    flex: none;
    width: 13px;
    height: 13px;
    color: var(--text-muted);
  }
  .row-hint {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  button {
    width: 100%;
    padding: 11px 12px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover:not(:disabled) {
    background: var(--primary-hover);
  }
  button:disabled {
    background: var(--primary-soft);
    color: var(--text-muted);
    cursor: default;
  }
  button.secondary {
    margin-top: 8px;
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary);
    padding: 9.5px 12px;
  }
  button.secondary:hover:not(:disabled) {
    background: var(--primary-soft);
  }
  button.secondary:disabled {
    color: var(--text-muted);
    border-color: var(--border);
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text);
  }
  input::placeholder {
    color: var(--text-muted);
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
  }
  #access-code-view p {
    margin: 4px 2px 10px;
    color: var(--text-muted);
  }
  #change-access-code-link,
  #guidelines-writer-link {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    text-decoration: none;
  }
  #change-access-code-link:hover,
  #guidelines-writer-link:hover {
    color: var(--primary);
  }
  .segmented {
    display: flex;
    background: var(--bg);
    border-radius: var(--radius-full);
    padding: 3px;
  }
  .segmented .segment {
    flex: 1;
    width: auto;
    margin: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 4px;
    border-radius: var(--radius-full);
  }
  .segmented .segment.active {
    background: var(--primary);
    color: white;
  }
  #status {
    margin-top: 4px;
    padding: 0 2px;
    color: var(--text-muted);
  }
  #status.error {
    color: var(--danger);
  }
  #results {
    margin-top: 8px;
    padding: 0;
    list-style: none;
  }
  #results li {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 6px;
  }
  #results li .name {
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }
  #results li .category {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
    color: white;
  }
  #results li .category.project_brief {
    background: #0d99ff;
  }
  #results li .category.design_system {
    background: #9747ff;
  }
  #results li .category.accessibility_usability {
    background: #ff9900;
  }
  #results li .category.flow_logic {
    background: #00b894;
  }
</style>

<div id="main-scroll">
<div id="app-header">
  <span id="app-title">Design Review Assistant</span>
  <span id="build-version">v9</span>
</div>

<div id="access-code-view" style="display: none">
  <div class="card">
    <div class="card-row">
      <p>Enter the team access code to use this plugin.</p>
      <input id="access-code-input" type="password" placeholder="Access code" />
    </div>
  </div>
  <button id="save-access-code-button">Save</button>
</div>

<div id="review-view" style="display: none">
  <div class="card">
    <div class="card-row">
      <div id="file-link-label" class="row-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
        Figma file link
      </div>
      <input id="file-link-input" type="text" placeholder="https://www.figma.com/design/..." />
      <div class="row-hint">Update this if you switch to a different file</div>
    </div>
  </div>

  <div class="card">
    <div class="card-row">
      <div id="platform-label" class="row-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
          <line x1="8" y1="21" x2="16" y2="21" />
          <line x1="12" y1="17" x2="12" y2="21" />
        </svg>
        Interface type
      </div>
      <div id="platform-control" class="segmented">
        <button type="button" class="segment" data-platform="web">Web</button>
        <button type="button" class="segment" data-platform="mobile">Mobile</button>
      </div>
    </div>
    <div class="card-row">
      <div id="language-label" class="row-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="2" y1="12" x2="22" y2="12" />
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
        Comment language
      </div>
      <div id="language-control" class="segmented">
        <button type="button" class="segment" data-lang="en">EN</button>
        <button type="button" class="segment" data-lang="ja">日本語</button>
        <button type="button" class="segment" data-lang="zh-Hant">繁中</button>
        <button type="button" class="segment" data-lang="zh-Hans">简中</button>
      </div>
    </div>
  </div>

  <button id="review-button">Review Selected Frame</button>
  <button id="review-flow-button" class="secondary">Review User Flow</button>
</div>

<div id="status"></div>
<ul id="results"></ul>
</div>

<div id="app-footer" style="display: none">
  <a href="https://figma-review-app.onrender.com/guidelines-review" target="_blank" rel="noopener" id="guidelines-writer-link">Open Guidelines Writer ↗</a>
  <a href="#" id="change-access-code-link">Change access code</a>
</div>

<script>
  const button = document.getElementById("review-button");
  const flowButton = document.getElementById("review-flow-button");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const accessCodeView = document.getElementById("access-code-view");
  const reviewView = document.getElementById("review-view");
  const appFooter = document.getElementById("app-footer");
  const accessCodeInput = document.getElementById("access-code-input");
  const saveAccessCodeButton = document.getElementById("save-access-code-button");
  const changeAccessCodeLink = document.getElementById("change-access-code-link");
  const languageControl = document.getElementById("language-control");
  const platformControl = document.getElementById("platform-control");
  const fileLinkInput = document.getElementById("file-link-input");

  fileLinkInput.addEventListener("change", () => {
    parent.postMessage({ pluginMessage: { type: "setFileLink", link: fileLinkInput.value } }, "*");
  });

  function setActiveLanguageSegment(lang) {
    for (const segment of languageControl.querySelectorAll(".segment")) {
      segment.classList.toggle("active", segment.dataset.lang === lang);
    }
  }

  // Not persisted like language -- re-suggested fresh by code.ts whenever
  // the Figma selection changes, though still overridable here before
  // clicking review.
  let currentPlatform = "web";

  function setActivePlatformSegment(platform) {
    currentPlatform = platform;
    for (const segment of platformControl.querySelectorAll(".segment")) {
      segment.classList.toggle("active", segment.dataset.platform === platform);
    }
  }

  setActivePlatformSegment(currentPlatform);

  function setStatus(text, isError) {
    status.textContent = text || "";
    status.className = isError ? "error" : "";
  }

  function setButtonsDisabled(disabled) {
    button.disabled = disabled;
    flowButton.disabled = disabled;
  }

  function showAccessCodeView(message) {
    accessCodeView.style.display = "block";
    reviewView.style.display = "none";
    appFooter.style.display = "none";
    setStatus(message, Boolean(message));
  }

  function showReviewView() {
    accessCodeView.style.display = "none";
    reviewView.style.display = "block";
    appFooter.style.display = "block";
    setStatus("");
  }

  function renderResults(applied, failedCount) {
    results.innerHTML = "";
    for (const item of applied) {
      const li = document.createElement("li");
      const category = document.createElement("span");
      category.className = `category ${item.categorySlug}`;
      category.textContent = item.categoryLabel;
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      const comment = document.createElement("span");
      comment.textContent = item.comment;
      li.appendChild(category);
      li.appendChild(name);
      li.appendChild(comment);
      results.appendChild(li);
    }
    if (failedCount > 0) {
      const li = document.createElement("li");
      li.textContent = `${failedCount} comment(s) couldn't be posted.`;
      results.appendChild(li);
    }
  }

  button.addEventListener("click", () => {
    setButtonsDisabled(true);
    results.innerHTML = "";
    setStatus("Starting review...");
    parent.postMessage({ pluginMessage: { type: "review", platform: currentPlatform } }, "*");
  });

  platformControl.addEventListener("click", (event) => {
    const segment = event.target.closest(".segment");
    if (!segment) return;
    setActivePlatformSegment(segment.dataset.platform);
  });

  flowButton.addEventListener("click", () => {
    setButtonsDisabled(true);
    results.innerHTML = "";
    setStatus("Starting flow review...");
    parent.postMessage({ pluginMessage: { type: "reviewFlow" } }, "*");
  });

  saveAccessCodeButton.addEventListener("click", () => {
    const code = accessCodeInput.value.trim();
    if (!code) return;
    parent.postMessage({ pluginMessage: { type: "setAccessCode", code } }, "*");
  });

  changeAccessCodeLink.addEventListener("click", (event) => {
    event.preventDefault();
    accessCodeInput.value = "";
    showAccessCodeView();
  });

  languageControl.addEventListener("click", (event) => {
    const segment = event.target.closest(".segment");
    if (!segment) return;
    const lang = segment.dataset.lang;
    setActiveLanguageSegment(lang);
    parent.postMessage({ pluginMessage: { type: "setLanguage", language: lang } }, "*");
  });

  window.onmessage = (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;

    if (message.type === "init") {
      setActiveLanguageSegment(message.language || "en");
      fileLinkInput.value = message.fileLink || "";
      if (message.hasAccessCode) {
        showReviewView();
      } else {
        showAccessCodeView();
      }
    } else if (message.type === "platformSuggestion") {
      setActivePlatformSegment(message.platform);
    } else if (message.type === "needsAccessCode") {
      showAccessCodeView(message.message);
    } else if (message.type === "accessCodeSaved") {
      showReviewView();
    } else if (message.type === "status") {
      setStatus(message.message);
    } else if (message.type === "error") {
      setStatus(message.message, true);
      setButtonsDisabled(false);
    } else if (message.type === "done") {
      setStatus(`Done -- posted ${message.applied.length} comment(s).`);
      renderResults(message.applied, message.failedCount);
      setButtonsDisabled(false);
    }
  };
</script>
