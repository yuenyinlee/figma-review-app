<style>
  body {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    margin: 0;
    padding: 12px;
    color: #1e1e1e;
  }
  button {
    width: 100%;
    padding: 8px 12px;
    background: #18a0fb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #b3e0ff;
    cursor: default;
  }
  #status {
    margin-top: 10px;
    color: #666;
  }
  #status.error {
    color: #d32f2f;
  }
  #results {
    margin-top: 10px;
    padding: 0;
    list-style: none;
  }
  #results li {
    padding: 8px 0;
    border-top: 1px solid #e5e5e5;
  }
  #results li .name {
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
  }
  #results li .category {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
    color: white;
  }
  #results li .category.project_brief {
    background: #0d99ff;
  }
  #results li .category.design_system {
    background: #9747ff;
  }
  #results li .category.accessibility_usability {
    background: #ff9900;
  }
  #results li .category.flow_logic {
    background: #00b894;
  }
  button.secondary {
    margin-top: 8px;
    background: transparent;
    color: #18a0fb;
    border: 1px solid #18a0fb;
  }
  button.secondary:disabled {
    color: #b3e0ff;
    border-color: #b3e0ff;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    margin-bottom: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 12px;
  }
  #access-code-view p {
    margin: 0 0 8px;
    color: #666;
  }
  #change-access-code-link,
  #guidelines-writer-link {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    color: #666;
    text-align: center;
  }
  #language-label,
  #platform-label,
  #file-link-label {
    font-size: 11px;
    color: #666;
    margin-bottom: 4px;
  }
  .segmented {
    display: flex;
    border: 1px solid #18a0fb;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .segmented .segment {
    flex: 1;
    width: auto;
    margin: 0;
    border: none;
    border-radius: 0;
    background: white;
    color: #18a0fb;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 4px;
    cursor: pointer;
  }
  .segmented .segment + .segment {
    border-left: 1px solid #18a0fb;
  }
  .segmented .segment.active {
    background: #18a0fb;
    color: white;
  }
  #review-actions-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  #build-version {
    font-weight: 400;
    color: #999;
  }
</style>

<div id="access-code-view" style="display: none">
  <p>Enter the team access code to use this plugin.</p>
  <input id="access-code-input" type="password" placeholder="Access code" />
  <button id="save-access-code-button">Save</button>
</div>

<div id="review-view" style="display: none">
  <div id="file-link-label">Figma file link (paste this file's URL -- update if you switch files)</div>
  <input id="file-link-input" type="text" placeholder="https://www.figma.com/design/..." />
  <div id="platform-label">Interface type</div>
  <div id="platform-control" class="segmented">
    <button type="button" class="segment" data-platform="web">Web</button>
    <button type="button" class="segment" data-platform="mobile">Mobile</button>
  </div>
  <div id="language-label">Comment language</div>
  <div id="language-control" class="segmented">
    <button type="button" class="segment" data-lang="en">EN</button>
    <button type="button" class="segment" data-lang="ja">日本語</button>
    <button type="button" class="segment" data-lang="zh-Hant">繁中</button>
    <button type="button" class="segment" data-lang="zh-Hans">简中</button>
  </div>
  <div id="review-actions-title">Design Review Assistant <span id="build-version">v1.3</span></div>
  <button id="review-button">Review Selected Frame</button>
  <button id="review-flow-button" class="secondary">Review User Flow</button>
  <a href="https://figma-review-app.onrender.com/guidelines-review" target="_blank" rel="noopener" id="guidelines-writer-link">Open Guidelines Writer ↗</a>
  <a href="#" id="change-access-code-link">Change access code</a>
</div>

<div id="status"></div>
<ul id="results"></ul>

<script>
  const button = document.getElementById("review-button");
  const flowButton = document.getElementById("review-flow-button");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const accessCodeView = document.getElementById("access-code-view");
  const reviewView = document.getElementById("review-view");
  const accessCodeInput = document.getElementById("access-code-input");
  const saveAccessCodeButton = document.getElementById("save-access-code-button");
  const changeAccessCodeLink = document.getElementById("change-access-code-link");
  const languageControl = document.getElementById("language-control");
  const platformControl = document.getElementById("platform-control");
  const fileLinkInput = document.getElementById("file-link-input");

  fileLinkInput.addEventListener("change", () => {
    parent.postMessage({ pluginMessage: { type: "setFileLink", link: fileLinkInput.value } }, "*");
  });

  function setActiveLanguageSegment(lang) {
    for (const segment of languageControl.querySelectorAll(".segment")) {
      segment.classList.toggle("active", segment.dataset.lang === lang);
    }
  }

  // Not persisted like language -- re-suggested fresh by code.ts whenever
  // the Figma selection changes, though still overridable here before
  // clicking review.
  let currentPlatform = "web";

  function setActivePlatformSegment(platform) {
    currentPlatform = platform;
    for (const segment of platformControl.querySelectorAll(".segment")) {
      segment.classList.toggle("active", segment.dataset.platform === platform);
    }
  }

  setActivePlatformSegment(currentPlatform);

  function setStatus(text, isError) {
    status.textContent = text || "";
    status.className = isError ? "error" : "";
  }

  function setButtonsDisabled(disabled) {
    button.disabled = disabled;
    flowButton.disabled = disabled;
  }

  function showAccessCodeView(message) {
    accessCodeView.style.display = "block";
    reviewView.style.display = "none";
    setStatus(message, Boolean(message));
  }

  function showReviewView() {
    accessCodeView.style.display = "none";
    reviewView.style.display = "block";
    setStatus("");
  }

  function renderResults(applied, failedCount) {
    results.innerHTML = "";
    for (const item of applied) {
      const li = document.createElement("li");
      const category = document.createElement("span");
      category.className = `category ${item.categorySlug}`;
      category.textContent = item.categoryLabel;
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      const comment = document.createElement("span");
      comment.textContent = item.comment;
      li.appendChild(category);
      li.appendChild(name);
      li.appendChild(comment);
      results.appendChild(li);
    }
    if (failedCount > 0) {
      const li = document.createElement("li");
      li.textContent = `${failedCount} comment(s) couldn't be posted.`;
      results.appendChild(li);
    }
  }

  button.addEventListener("click", () => {
    setButtonsDisabled(true);
    results.innerHTML = "";
    setStatus("Starting review...");
    parent.postMessage({ pluginMessage: { type: "review", platform: currentPlatform } }, "*");
  });

  platformControl.addEventListener("click", (event) => {
    const segment = event.target.closest(".segment");
    if (!segment) return;
    setActivePlatformSegment(segment.dataset.platform);
  });

  flowButton.addEventListener("click", () => {
    setButtonsDisabled(true);
    results.innerHTML = "";
    setStatus("Starting flow review...");
    parent.postMessage({ pluginMessage: { type: "reviewFlow" } }, "*");
  });

  saveAccessCodeButton.addEventListener("click", () => {
    const code = accessCodeInput.value.trim();
    if (!code) return;
    parent.postMessage({ pluginMessage: { type: "setAccessCode", code } }, "*");
  });

  changeAccessCodeLink.addEventListener("click", (event) => {
    event.preventDefault();
    accessCodeInput.value = "";
    showAccessCodeView();
  });

  languageControl.addEventListener("click", (event) => {
    const segment = event.target.closest(".segment");
    if (!segment) return;
    const lang = segment.dataset.lang;
    setActiveLanguageSegment(lang);
    parent.postMessage({ pluginMessage: { type: "setLanguage", language: lang } }, "*");
  });

  window.onmessage = (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;

    if (message.type === "init") {
      setActiveLanguageSegment(message.language || "en");
      fileLinkInput.value = message.fileLink || "";
      if (message.hasAccessCode) {
        showReviewView();
      } else {
        showAccessCodeView();
      }
    } else if (message.type === "platformSuggestion") {
      setActivePlatformSegment(message.platform);
    } else if (message.type === "needsAccessCode") {
      showAccessCodeView(message.message);
    } else if (message.type === "accessCodeSaved") {
      showReviewView();
    } else if (message.type === "status") {
      setStatus(message.message);
    } else if (message.type === "error") {
      setStatus(message.message, true);
      setButtonsDisabled(false);
    } else if (message.type === "done") {
      setStatus(`Done -- posted ${message.applied.length} comment(s).`);
      renderResults(message.applied, message.failedCount);
      setButtonsDisabled(false);
    }
  };
</script>
